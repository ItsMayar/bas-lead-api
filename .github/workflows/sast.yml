name: SAST Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      # Runs Semgrep's default security ruleset against the codebase.
      # On a pull request, findings are posted inline as review comments.
      # On a direct push, results are written to the job log and as a
      # SARIF file uploaded to GitHub's Security tab.
      - name: Run Semgrep
        run: semgrep scan --config auto --sarif --output semgrep-results.sarif
        env:
          SEMGREP_RULES: p/security-audit p/secrets p/owasp-top-ten

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
